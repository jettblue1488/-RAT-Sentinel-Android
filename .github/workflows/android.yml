name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the runner Android SDK."
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure persistent signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.RAT_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.RAT_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RAT_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RAT_SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/rat-signing"
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/rat-signing/release.jks"
          echo "RAT_SIGNING_STORE_FILE=$RUNNER_TEMP/rat-signing/release.jks" >> "$GITHUB_ENV"
          echo "RAT_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RAT_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RAT_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          gradle --version
          if [ -n "${RAT_SIGNING_STORE_FILE:-}" ]; then
            gradle :app:assembleRelease --stacktrace
          else
            echo "Persistent signing secrets are not configured; building a temporary debug APK."
            gradle :app:assembleDebug --stacktrace
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAT-Sentinel-install
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
